baseURL = 'https://blog.imfsoftware.com/llm-wiki/'
languageCode = 'en-us'
title = 'LLM Wiki — Agentic AI Landscape'
theme = 'hugo-book'

[params]
  BookTheme = 'auto'
  BookToC = true
  BookSection = 'docs'
  BookRepo = 'https://github.com/imforster/llm-wiki'
  BookSearch = true
  BookDateFormat = 'January 2, 2006'
  BookPortableLinks = true

[[menu.before]]
  name = "← blog.imfsoftware.com"
  url = "https://blog.imfsoftware.com"
  weight = 1

[[menu.before]]
  name = "🏠 Overview"
  url = "/llm-wiki/docs/"
  weight = 2

[params.bookComments]
  enabled = false

[markup]
  [markup.goldmark]
    [markup.goldmark.renderer]
      unsafe = true
    [markup.goldmark.extensions]
      strikethrough = true
      table = true

[outputs]
  home = ['HTML', 'RSS', 'JSON']
